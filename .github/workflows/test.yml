name: EmojiMart Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A public repo, so pull requests from any fork run here: GitHub-hosted
  # runners only, never the self-hosted np-amd64 ones inside the homelab.
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - uses: nodenv/actions/node-version@df3bcfc522c56af4103c51d0f4dff0278358c896 # v2.0.10
        id: nodenv

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '${{ steps.nodenv.outputs.node-version }}'
          cache: 'yarn'

      - run: yarn install
      - run: yarn prettier
      - run: yarn check:types

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - uses: nodenv/actions/node-version@df3bcfc522c56af4103c51d0f4dff0278358c896 # v2.0.10
        id: nodenv

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '${{ steps.nodenv.outputs.node-version }}'
          cache: 'yarn'

      - run: yarn install
      - run: yarn test
